# 창원국가산단 ELECTRE TRI-B 재검증 사전등록본
# 이 파일의 목적: veto 수준·참조사례·q·p 도출규칙을 결과를 보기 전에 고정한다.
# prereg_status를 REGISTERED로 바꾸는 것은 사람의 행위이며 코드가 하지 않는다.

prereg_spec_version: changwon-revalidation/1.0.0
prereg_status: REGISTERED            # DRAFT | REGISTERED
base_parameter_sha256: bef58985e0714e5a149bbbbf667ed271296f86fc1b7d056f18d3518723da70f0          # .yaml에서는 params.parameter_payload_sha256 실계산값
                                     # (기대값: bef58985e0714e5a149bbbbf667ed271296f86fc1b7d056f18d3518723da70f0)

# ---------------------------------------------------------------- 폐기하는 기존 검증 게이트
# Phase 3 supersession 레코드가 이 블록을 그대로 인용한다. 코드에 문구를 하드코딩하지 않는다.
invalidated_gates:
  - id: IG1
    retired: calibration/holdout next_negative_state 기반 후보 선택 및 채택 판정
    reason: >-
      타깃 next_negative_state는 "다음 분기 고용 YoY < 0"과 동치이며,
      "현재 고용이 감소 중인가"라는 이진변수 하나가 모든 ELECTRE 후보보다
      전 구간에서 순위연관이 높다(CAL 0.7995 / HOLD 0.6190 / ALL 0.7501
      vs 후보 D의 0.7470 / 0.4446 / 0.6497). 이 타깃 위에서 다기준 분류모형은
      원리적으로 열위이므로 선택 기준으로 쓸 수 없다.
  - id: IG2
    retired: holdout_ordered_next_negative (PRIORITY > CHECK > OBSERVE 엄격 순서)
    reason: >-
      고용 감소가 시작되면 다음 분기 감소 확률이 88~90%로 포화되어
      CHECK와 PRIORITY가 분리되지 않는다(전체기간 CHECK 0.882 vs PRIORITY 0.885,
      차이 0.003). 어떤 파라미터로도 달성할 수 없는 조건이다.
  - id: IG3
    retired: external_direction_supported (가동률·가동업체수 순위연관 동시 양수)
    reason: >-
      가동률은 순위연관 0.012이고 값의 50%가 근사값, 40행 결측이다.
      가동업체수는 세 단계 모두 중앙값이 0으로 판별력이 없다.
      구성타당도가 확립되지 않은 지표를 필수 게이트로 쓸 수 없다.
new_status_label: SUPERSEDED_BY_REDESIGN

# ---------------------------------------------------------------- 규범적 참조사례
# 결과를 보고 고른 것이 아니라 행정 규범에서 도출한다. 팀 검토 후에만 확정한다.
reference_cases:
  - id: RC1
    industry: 기계
    quarter: 2022Q1
    relation: at_least
    stage: CHECK
    rationale: >-
      고용 2,394명(-3.67%p) 감소는 단일 분기라도 최소 추가확인 대상이다.
      이는 대량 고용변동 신고 기준(30명)의 수십 배 규모다.
  - id: RC2
    industry: 전기전자
    quarter: 2025Q1
    relation: at_least
    stage: CHECK
    rationale: >-
      고용 907명(-3.10%p) 감소는 최소 추가확인 대상이다.
      이는 대량 고용변동 신고 기준(30명)의 수십 배 규모다.
  - id: RC3
    industry: 기타
    quarter: 2026Q2
    relation: at_most
    stage: OBSERVE
    rationale: 고용이 17.1% 증가한 업종은 관찰을 넘지 않는다.
reference_case_rule:
  pass_rate_required: 1.0
  undetermined_counts_as: fail

# ---------------------------------------------------------------- 허용 파라미터 공간
parameter_space:
  lambda: {min: 0.50, max: 0.75}
  weights: {min: 0.10, max: 0.40, simplex: dirichlet_ones}
  p_upper: {g1: 100, g2: 2.0, g3: 5.0, g4: 2.0}      # 개정: b1 프로파일 값으로 제한
  p_constraint: p_j <= b1_j
  p_constraint_rationale: >-
    g1~g4는 모두 max(0, ·) 형태의 절단 척도이므로 하한이 0이다.
    p_j > b1_j 이면 감소가 전혀 없는 행(g_j = 0)조차 최하위 경계에서
    양의 부분 concordance를 받고, 고용증거 게이트(c_j > 0)까지 통과한다.
    이는 "감소 없음"을 "감소 증거 있음"으로 취급하는 것이므로 허용하지 않는다.
  q_rule: uniform_0_to_half_p
  n_samples: 6000
  seed: 2026
  lambda_lower_bound_rationale: >-
    λ < 0.50이면 소수 연합이 outranking을 성립시켜 concordance의
    '자격을 갖춘 다수' 해석과 모순된다. 따라서 하한을 0.50으로 고정한다.

# ---------------------------------------------------------------- q·p 도출규칙 (Phase 4)
# 결과가 아니라 실측 불확실성에서 도출한다. 코드가 계산하고 계산값을 산출물에 기록한다.
qp_derivation:
  source_vintage: outputs/tables/vintage_수정폭_실측.csv
  rounding: {g1: 10, g2: 0.5, g3: 0.5, g4: 1}
  g1:
    p_source: vintage_employment_abs_p90     # |수정폭| 90분위(명). 기대 37.5 → 반올림 40
    q: 0
    q_rationale: 인원 단위에서 무차별로 볼 근거가 별도로 없어 0으로 둔다.
  g2:
    p_source: vintage_employment_pct_p90     # |수정율%| 90분위. 기대 1.944 → 반올림 2.0
    q: 0.5
    q_rationale: 사전등록된 0.5/1/2%p 민감도 밴드의 최소값. 계측 오차 하한에 해당한다.
  g3:
    p_source: nominal_ppi_adjusted_gap_p75   # |production_yoy - ppi_adjusted_upper| 75분위. 기대 6.798 → 7.0
    q_source: nominal_ppi_adjusted_gap_p50   # 기대 2.487 → 2.5
    p_constraint_applied: true
    p_constraint_note: >-
      도출값(약 6.80%p)이 제약 상한 b1_g3 = 5.0%p 를 초과하므로 5.0으로 절단한다.
      명목 생산 YoY와 PPI 조정 생산 YoY 사이의 격차가 g3 최하위 경계값보다 크다는
      사실 자체가 경계 프로파일의 문제이며 q·p로 흡수할 수 없다.
      Phase 4에서 경계 프로파일 항목으로 별도 취급한다.
    rationale: >-
      명목-실질 격차의 중앙값이 2.49%p, 75분위가 6.80%p로 g3의 b1(5)-b2(10)
      간격과 같은 크기다. 기존 후보 A~D의 p_g3(0~3)은 실측 불확실성보다 과소하다.
  g4:
    p: 1
    q: 0
    rationale: 개정으로 YoY 부호가 1회 뒤집히면 연속분기 런이 1분기 변한다.

# ---------------------------------------------------------------- veto 후보
# 문턱값은 기준 척도 위의 절대값이며 엄격부등호를 쓴다: g_j < threshold_value 이면 차단.
# 고전 표기 v_j = b_hj - threshold_value 는 기록용이며 계산에 쓰지 않는다.
veto_relation: strict_less_than
veto_missing_rule: do_not_block          # g_j가 NaN이면 차단하지 않는다
veto_candidates:
  - id: V0
    label: veto 없음(현행)
    enabled: false
  - id: V1
    label: b2 g1 최소 감소인원 30명
    enabled: true
    boundary: b2
    criterion: g1
    threshold_value: 30
    unit: persons
    rationale: >-
      고용 감소 인원이 30명 미만인 업종×분기는 우선점검으로 올리지 않는다.
      고용정책 기본법 제33조 대량 고용변동 신고 제도가 상시근로자 300명 미만
      사업장에 대해 1개월 내 이직 30명 이상을 신고 기준으로 삼는 점을 차용한다.
    borrowed_standard: 고용정책 기본법 제33조 및 시행령 대량 고용변동 신고 기준
    borrowing_limitation: >-
      법정 기준은 사업장 단위·1개월 이직자 수이고 이 모형은 업종 집계·전년동기 대비이므로
      직접 적용이 아니라 하한 설정의 근거로 차용한 것이다.
veto_selection_rule: >-
  V1 이 C1~C4 를 통과하면 채택하고, 통과하지 못하면 V0(veto 없음)을 유지한다.
  이 규칙은 결과를 보기 전에 고정되며 실행 후 변경하지 않는다.

# ---------------------------------------------------------------- 입력자료 교란
perturbation:
  source: outputs/tables/vintage_수정폭_실측.csv
  value_column: 수정율pct
  scale: percent_to_ratio                  # 값/100 을 승수 (1+r) 로 사용
  apply_to: [employment, employment_lag4, production, production_lag4]
  independent_draws: true
  n_replicates: 400
  seed: 99
  g4_recompute: true
  g4_seed_rule: panel_2022Q1_g4_minus_one_floor_zero
  self_check: 승수를 전부 1.0으로 두면 단계 유지율이 정확히 1.0이어야 한다. 아니면 즉시 중단.

# ---------------------------------------------------------------- 동시점 독립지표 역할
concurrent_indicators:
  - column: ppi_adjusted_prod_yoy_upper
    role: supporting
    expected_sign: negative
    caveat: ppi_mapping_confirmation_status가 180행 전부 NOT_CONFIRMED이므로 보조 참고로만 쓴다.
  - column: ppi_adjusted_prod_yoy_lower
    role: supporting
    expected_sign: negative
    caveat: 위와 동일.
  - column: op_rate_used_yoy_pp
    role: informational_only
    reason: 단계별 중앙값이 비단조(-0.67 / +1.36 / -1.69), 50%가 근사값, 40행 결측.
  - column: firm_count_delta_yoy
    role: informational_only
    reason: 세 단계 모두 중앙값 0으로 판별력이 없다.

# ---------------------------------------------------------------- 비포화 시간타깃 (보조)
supporting_temporal_targets:
  - id: T1
    definition: next_decline_depth = max(0, -다음분기 employment_yoy)
    role: supporting
  - id: T2
    definition: next2_both_negative = (다음분기 employment_yoy < 0) and (2분기 후 employment_yoy < 0)
    role: supporting
gate_role_note: 시간타깃은 보조 지표이며 채택 게이트로 쓰지 않는다.

# ---------------------------------------------------------------- 불확실성 보고 규칙
uncertainty_reporting:
  method: cluster_bootstrap
  cluster_unit: industry
  n_bootstrap: 4000
  seed: 4242
  paired: true
  also_report_blocked_loio: true
  report_all_folds: true
  holdout_note: >-
    2025Q1~2026Q2는 기존 q·p 보정 작업에서 이미 결과를 확인했으므로
    '한 번도 보지 않은 holdout'으로 표현하지 않는다.

# ---------------------------------------------------------------- 합격선
acceptance:
  C1_logical_violations_max: 0
  C2_pess_opt_agreement_min: 0.95
  C2_denominator: scorable_rows_only
  C2_denominator_rationale: >-
    양쪽 모두 UNDETERMINED인 행이 일치하는 것은 배정절차 강건성의 증거가 아니므로
    분모에서 제외한다.
  C2_evaluation_scope: per_scenario      # 시나리오별로 개별 판정하고 평균내지 않는다
  C3_retention_mean_min: 0.95
  C3_retention_p05_min: 0.90
  C4_reference_case_pass_rate: 1.0
  S1_necessary_share_min_on_discriminating: 0.30
  S1_evaluation_space: reference_compatible_subspace
  S1_also_report: [full_parameter_space, crisp_subspace]
  S1_evaluation_space_rationale: >-
    강건 배정(필연/가능)은 선호정보와 양립하는 부분공간 위에서 정의된다.
    제약 없는 파라미터 공간에서의 필연배정 비율은 합격 판정 대상이 아니라
    "선호정보 없이는 배정이 거의 결정되지 않는다"는 사실의 보고 항목이다.
discriminating_sample_definition: scorable AND NOT (g1 == 0 AND g2 == 0 AND g4 == 0)

# ---------------------------------------------------------------- 등록
registration:
  registered_at: '2026-09-17T00:00:00Z'
  registered_by: BOAZ 27기 시각화 미니프로젝트 3조
  prereg_sha256: 5c4f3e8664f0eac3c43a9437996398a5a7c7a131db20afc8bf6b751a84eb870c

# ---------------------------------------------------------------- 개정 이력
amendments:
  - id: AM1
    at: '2026-09-16T08:58:56Z'
    phase_at_amendment: 2
    prereg_status_at_amendment: DRAFT
    change: >-
      parameter_space.p_upper 를 {150, 2.5, 7.0, 2.0} → {100, 2.0, 5.0, 2.0} 으로 축소하고
      p_constraint: p_j <= b1_j 를 명시
    reason: >-
      p_j > b1_j 인 영역에서 g_j = 0 인 행이 양의 부분 concordance와 고용증거를 얻는
      이론적 결함을 확인했다. 결과를 개선하기 위한 조정이 아니라 허용공간에서
      정합성을 위반하는 영역을 제거하는 것이다.
    triggered_by: Phase 2 필연배정 비율 0.0112 의 원인 조사
    result_known_before_amendment: false
  - id: AM2
    at: '2026-09-16T08:58:56Z'
    phase_at_amendment: 2
    prereg_status_at_amendment: DRAFT
    change: acceptance.C2 의 분모를 scorable 행으로 한정하고 시나리오별 개별 판정으로 명시
    reason: UNDETERMINED 행의 일치는 배정절차 강건성의 증거가 아니다.
    triggered_by: Phase 2 에서 고용중시·지속성중시 시나리오의 불일치 확인
    result_known_before_amendment: true      # 결과를 본 뒤의 개정임을 명시한다
  - id: AM3
    at: '2026-09-17T00:00:00Z'
    phase_at_amendment: 2
    prereg_status_at_amendment: DRAFT
    change: >-
      acceptance.S1 의 평가 공간을 참조사례 양립 부분공간으로 명시하고
      전체 공간·crisp 부분공간 값은 보고 항목으로 분리
    reason: >-
      원안은 S1을 어느 공간에서 재는지 명시하지 않았다. 제약 없는 공간에서
      필연배정을 요구하는 것은 강건 배정의 정의와 맞지 않는다. 합격선 수치는 바꾸지 않는다.
    triggered_by: Phase 2 재실행에서 AM1 적용 후에도 공식값이 0.0112 로 불변인 원인 조사
    result_known_before_amendment: true
  - id: AM4
    at: '2026-09-17T00:00:00Z'
    phase_at_amendment: 3
    prereg_status_at_amendment: DRAFT
    change: Phase 4 종료 후의 분기 행동과 Phase 5 산출물 형태 전환 기준을 사전 확정
    reason: >-
      Phase 3에서 C3와 S1이 구조 수준 병목으로 확인됐다. Phase 4는 마지막 모형 변경
      시도이며, 그 결과에 따른 행동을 결과를 보기 전에 고정하지 않으면 사후 결정이 된다.
    result_known_before_amendment: false
    content:
      phase4_exit_rules:
        - id: EX1
          condition: Phase 4의 어떤 조합이 C3(평균 0.95, 5%분위 0.90)를 충족한다
          action: >-
            그 조합을 config/electre_tri_b_params.v1.2-candidates.yaml에 기록하고
            Phase 5에서 점 배정 유지 가능성을 검토한다. S1 미달은 별도로 남는다.
        - id: EX2
          condition: 어떤 조합도 C3를 충족하지 못한다
          action: >-
            입력자료 교란에 대한 점 배정의 한계를 확정하고, Phase 5에서
            공식 산출물을 점 배정에서 구간 배정(필연/가능 + CAI)으로 전환한다.
            합격선을 낮추지 않는다.
        - id: EX3
          condition: S1이 어떤 경우에도 0.30 미달이다
          action: >-
            산출물 형태와 무관하게 단일 단계의 단독 제시를 금지한다.
            모든 단계 표기에 가능 단계 범위를 병기한다.
      phase5_metric_redefinition:
        note: >-
          구간 배정으로 전환하면 C3의 정의가 "교란 후 단계가 원 단계와 같은가"에서
          "교란 후 단계가 원 가능 단계 범위 안에 들어오는가"로 바뀐다.
          이는 합격선을 낮추는 것이 아니라 산출물이 바뀌면 적합한 지표가 바뀌는 것이며,
          두 지표를 모두 보고하고 정의 차이를 명시한다.
        new_metric_id: C3b_interval_containment_rate
        threshold: 0.95
      preference_information_expansion:
        allowed: true
        condition: >-
          참조사례 추가는 실제 업종×분기를 지목하지 않고 가상 프로파일
          (g1, g2, g3, g4 값의 조합)로만 진술한다. 현재 모형의 배정 결과를
          보지 않은 상태에서 규범만으로 작성할 수 있어야 한다.
        rationale: >-
          선호정보가 부족해 배정이 결정되지 않는다는 것이 Phase 3의 진단이므로
          선호정보 확충은 정당한 처방이다. 다만 실제 행을 지목하면 결과 맞춤이 되므로
          가상 프로파일로 제한한다.
        timing: Phase 5 착수 시점. Phase 4 중에는 추가하지 않는다.
  - id: AM5
    at: '2026-09-17T00:00:00Z'
    phase_at_amendment: 3
    prereg_status_at_amendment: DRAFT
    change: >-
      veto 후보를 V1(10명)·V2(30명) 2개에서 V1(30명) 1개로 축소하고
      veto_selection_rule 을 단일 후보 기준으로 수정. RC1·RC2 의 rationale 에
      법정 기준 대비 규모 문장을 추가(사례 자체는 불변).
    reason: >-
      30명은 고용정책 기본법 제33조 대량 고용변동 신고 기준(상시근로자 300명 미만
      사업장, 1개월 내 이직 30명 이상)과 일치하는 외부 행정 근거가 있는 값이다.
      10명에는 그러한 근거가 없어 후보에서 제외한다. 후보를 1개로 줄이면
      사후선택 여지가 사라진다.
    result_known_before_amendment: false
    note: >-
      veto 수준별 성능은 등록 전에 확인하지 않았다. 30명 선택은 성능이 아니라
      외부 행정 근거의 유무로 결정했다.
  - id: AM6
    at: '2026-09-17T00:00:00Z'
    phase_at_amendment: 4
    prereg_status_at_amendment: REGISTERED
    change: >-
      AM4.preference_information_expansion 을 발동해 가상 프로파일 참조사례 5건을
      추가하고, 구간 배정 산출물의 합격 기준(I1~I4)과 교란 강건성 재정의(C3b·C3c)를
      사전등록한다.
    reason: >-
      Phase 4 에서 18개 조합 전부가 C3 를 미달했고(최댓값 0.935) S1 도 0.101 로
      미달했다. AM4 의 EX2·EX3 가 동시에 발동하므로 공식 산출물을 구간 배정으로
      전환하며, 그에 맞는 합격 기준을 결과를 보기 전에 고정한다.
    result_known_before_amendment: false
    note: >-
      아래 가상 참조사례 5건이 S1 을 올릴지 내릴지는 등록 전에 계산하지 않았다.
      이들은 모형이 원래 의도한 논리를 명시적으로 진술한 것이며,
      실제 업종×분기를 지목하지 않는다.

    content:
      # ---------- 1. 가상 프로파일 참조사례 ----------
      virtual_reference_cases:
        - id: VRC1
          profile: {g1: 500, g2: 5.0, g3: 10.0, g4: 4}
          relation: at_least
          stage: PRIORITY
          rationale: 네 기준이 모두 b2 경계 이상이면 우선점검이다.
        - id: VRC2
          profile: {g1: 0, g2: 0.0, g3: 0.0, g4: 0}
          relation: at_most
          stage: OBSERVE
          rationale: 생산과 고용 모두 감소가 없으면 관찰을 넘지 않는다.
        - id: VRC3
          profile: {g1: 500, g2: 5.0, g3: 0.0, g4: 1}
          relation: at_least
          stage: CHECK
          rationale: >-
            고용감소가 절대규모와 상대규모 양쪽에서 b2 경계를 넘으면
            생산이 감소하지 않고 지속기간이 짧더라도 최소 추가확인이다.
        - id: VRC4
          profile: {g1: 0, g2: 2.0, g3: 0.0, g4: 4}
          relation: at_least
          stage: CHECK
          rationale: >-
            고용감소가 b1 경계 이상이면서 4분기 이상 지속되면
            절대규모가 작고 생산이 감소하지 않더라도 최소 추가확인이다.
        - id: VRC5
          profile: {g1: 0, g2: 0.0, g3: 20.0, g4: 0}
          relation: at_most
          stage: OBSERVE
          rationale: >-
            고용감소 증거가 전혀 없으면 생산이 크게 감소해도 관찰이다.
            이는 고용증거 게이트가 의도한 동작을 명시한 것이다.
      virtual_reference_case_rule:
        evaluation: >-
          실제 패널에 추가하지 않고, 프로파일 값만으로 각 파라미터 표본의 배정을
          계산해 판정한다. 결측은 없으므로 항상 scorable 이다.
        pass_rate_required: 1.0
        combined_with_real_cases: true   # RC1~RC3 와 AND 로 결합

      # ---------- 2. 교란 강건성 재정의 ----------
      interval_robustness:
        - metric_id: C3b_point_in_interval
          definition: >-
            교란된 자료로 계산한 점 단계가, 원자료 기준 가능 단계 집합에 포함되는 비율.
          threshold: 0.95
          mandatory_companion: mean_n_possible_stages
          companion_note: >-
            가능 단계 집합이 넓으면 C3b 는 자동으로 높아진다. 따라서 평균 가능 단계 수를
            반드시 함께 보고하며, C3b 단독으로 강건성을 주장하지 않는다.
        - metric_id: C3c_interval_jaccard
          definition: >-
            교란된 자료로 가능 단계 집합을 다시 계산해 원 집합과의 Jaccard 유사도 평균.
          threshold: 0.90
          sampling: 교란 50회 × 파라미터 표본 1000개(근사). seed 는 prereg 값 사용.
      keep_reporting_c3: true
      keep_reporting_c3_note: >-
        기존 C3(점 배정 유지율)도 계속 보고한다. 지표를 교체하는 것이 아니라
        산출물 형태가 바뀌어 적합한 지표가 추가되는 것이며, 정의 차이를 명시한다.

      # ---------- 3. 구간 배정 산출물 합격 기준 ----------
      interval_acceptance:
        - id: I1
          definition: 모든 완전관측 행에서 가능 단계 집합이 공집합이 아니다.
          threshold: 1.0
        - id: I2
          definition: >-
            판별표본에서 가능 단계가 2개 이하인 행의 비율.
            정보가 없으면 모든 행이 3단계이므로, 절반 이상에서 최소 한 단계를
            배제할 수 있어야 산출물이 정보를 갖는다.
          threshold: 0.50
        - id: I3
          definition: C3b_point_in_interval
          threshold: 0.95
        - id: I4
          definition: >-
            최신분기(2026Q2) 10개 업종 중 가능 단계가 2개 이하인 업종 수의 비율.
          threshold: 0.60
      interval_acceptance_note: >-
        S1(필연배정 비율)은 점 배정의 정당성 기준이므로 구간 배정의 합격 기준에
        포함하지 않는다. S1 값은 계속 보고하되 pass 판정에 쓰지 않는다.
        이는 기준 완화가 아니라 산출물 형태 변경에 따른 기준 교체이며,
        단일 단계 단독 제시 금지(AM4.EX3)는 그대로 유지된다.

      # ---------- 4. 파라미터 무변경 ----------
      parameter_freeze:
        note: >-
          Phase 5 는 산출물 형태만 바꾸며 모형 파라미터를 바꾸지 않는다.
          config/electre_tri_b_params.yaml 은 수정하지 않는다.
          config/electre_tri_b_params.v1.2-candidates.yaml 은 adoption_status: null
          상태로 사람의 결정을 기다린다.
          점 단계는 세 시나리오 값을 참고로 병기만 한다.
